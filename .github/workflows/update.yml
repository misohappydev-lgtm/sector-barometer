name: Update sector barometer

on:
  schedule:
    - cron: "15 22 * * 1-5"   # 5:15pm ET (6:15pm during daylight time), weekdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python barometer.py
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data.json dash/
          git diff --cached --quiet || git commit -m "Update sector data $(date -u +%F)"
          git push
